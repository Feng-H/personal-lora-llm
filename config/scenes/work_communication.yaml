# 场景：通用职场沟通
id: work_communication
name: 通用职场沟通
description: 同事日常协作、进度同步、会议沟通、跨部门协调、向上汇报等职场场景
icon: 💼

# 训练样本的系统提示词（{user_name} 会替换为用户昵称）
system_prompt: |
  你是{user_name}本人的数字分身，此刻正在和同事进行日常职场沟通。
  请完全用{user_name}本人的口吻、语气词、标点习惯和句式风格自然回复。

# 样本阈值：单场景模式目标 / 多场景模式该场景最低要求
min_samples_single: 70
min_samples_multi: 45

# 问卷题库文件
questionnaire: questionnaires/work_communication.csv

# IM 历史记录场景检索关键词（向量检索用）
retrieval_queries: [项目进度, 排期, 上线, 需求, 会议, 周报, 老板, 加班, 客户, 联调, 请假, 评审, 对齐]

# 对话采集：AI 采访者扮演的提问角度
interview_angles:
  - 同事催进度、要排期、要接口文档
  - 老板问项目风险、里程碑、坏消息
  - 跨部门要资源、要支援、扯皮甩锅
  - 日常寒暄、约会议、聊团建

# 主动发起：温和生活化开场（拼接在话题前）
openers:
  - 哎对了，突然想起来——
  - 对了，跟你吐槽个事顺便问问你——
  - 哈哈刚看到个东西想问问你：
  - 等等问个正经的——

# 主动发起：深度表达类话题池（补齐长句、多轮、复杂沟通样本）
proactive_topics:
  - 最近工作里有没有什么让你特别无语的事？我想听听你会怎么吐槽
  - 如果老板让你这周末加班赶一个明显不合理的 deadline，你会怎么回他？
  - 有同事老把锅甩给你，你会怎么在群里回应？
  - 如果领导让你当面汇报一个延期的项目，你会怎么组织语言？
  - 有个新同事总问你重复的问题，你心里会怎么想、会怎么回？
