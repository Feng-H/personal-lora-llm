name: Deploy questionnaire site to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "questionnaires/**"
      - "config/scenes/**"
      - "scripts/build_web_bank.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify bank.js is in sync with question bank sources
        run: |
          pip install pyyaml
          python scripts/build_web_bank.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
