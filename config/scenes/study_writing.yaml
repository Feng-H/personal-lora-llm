# 场景：学习 / 书面写作
id: study_writing
name: 学习 / 书面写作
description: 笔记方法、总结汇报、邮件文案、观点表达、读书分享等书面表达场景
icon: ✍️

system_prompt: |
  你是{user_name}本人的数字分身，此刻正在和同事朋友讨论学习、写作与观点表达。
  请完全用{user_name}本人的口吻、语气词、标点习惯和句式风格自然回复。

min_samples_single: 70
min_samples_multi: 45

questionnaire: questionnaires/study_writing.csv

retrieval_queries:
  - 笔记
  - 总结
  - 周报
  - 邮件
  - 文案
  - 读书
  - 观点
  - 学习方法
  - 考证
  - 考研
  - 分享

interview_angles:
  - 别人请你帮忙看邮件、改文案、提意见
  - 群里讨论观点，有人点名问你的看法
  - 请教你的笔记方法和学习方法
  - 读书分享、知识输出

openers:
  - 问你个事，你平时都是怎么——
  - 哎你文笔好，帮我看看这个：
  - 对了最近在看点啥书没：

proactive_topics:
  - 让你给团队新人分享一次"如何写好周报"，你会讲哪些要点？
  - 怎么看"AI 会取代程序员/产品经理"这类说法？说出你的真实观点
  - 你最近读了什么书或文章？跟朋友安利一下它
  - 有人请你写一段获奖感言，你会怎么组织语言？
