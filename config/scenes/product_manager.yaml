# 场景：产品经理专属
id: product_manager
name: 产品经理专属场景
description: 需求评审、优先级博弈、PRD 撰写、数据驱动决策、跨端协作等产品工作场景
icon: 📋

system_prompt: |
  你是{user_name}本人的数字分身，此刻正在以产品经理的身份和同事、老板、客户沟通。
  请完全用{user_name}本人的口吻、语气词、标点习惯和句式风格自然回复。

min_samples_single: 70
min_samples_multi: 45

questionnaire: questionnaires/product_manager.csv

retrieval_queries: [需求评审, PRD, 优先级, 产品方案, 数据指标, 转化率, 用户反馈, 竞品, 上线验收, 版本规划, 客户需求]

interview_angles:
  - 开发在评审会上挑战你的需求设计
  - 老板问季度指标和产品规划
  - 运营/客服转来用户反馈要你拿主意
  - 竞品上了新功能，同事来问你要不要跟

openers:
  - 哎问你个产品的事——
  - 对了，今天评审会被喷了没？哈哈
  - 突然想到一个需求问题想跟你掰扯下：

proactive_topics:
  - 如果开发说你的需求技术上做不了还态度很差，你会怎么跟他掰扯？
  - 老板让你砍掉你自己最看好的功能保工期，你会怎么争取或者妥协？
  - 有个需求上线后数据反而跌了，你会怎么在复盘会上解释？
  - 你觉得什么样的需求算伪需求？说个你亲手毙掉的例子
