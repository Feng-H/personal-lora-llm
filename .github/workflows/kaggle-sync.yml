name: Sync notebook to Kaggle

# Fork 即用：无需克隆仓库，配 1 个 Secret 即可自动同步 notebook 到你的 Kaggle。
#
# ── Fork 用户一次性配置（约 2 分钟）────────────────────────────
# 1. 打开自己 fork 仓库的 Actions 标签页 → 绿色按钮启用 workflows
# 2. https://www.kaggle.com/settings → API → 生成 token（复制那串字符）
# 3. 仓库 Settings → Secrets and variables → Actions → New repository secret：
#      Name:  KAGGLE_API_TOKEN
#      Value: 粘贴 token
#    （旧式 kaggle.json 用户改为配 KAGGLE_USERNAME + KAGGLE_KEY 两个 secret）
# 4. Actions → Sync notebook to Kaggle → Run workflow
# 之后 notebook / 同步脚本有更新时，push 到 main 即自动同步。
#
# 安全：Secrets 加密存储、日志自动打码、fork 来的 PR 拿不到；
#       永远不要把 token 粘贴到 issue / PR / 代码文件里。

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "scripts/sync_kaggle.sh"
      - ".github/workflows/kaggle-sync.yml"
  workflow_dispatch:
    inputs:
      attach_dataset:
        description: "预挂数据集 <你的用户名>/my-persona-data（不存在则自动跳过）"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  push-to-kaggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kaggle CLI
        run: pip install kaggle

      - name: Sync notebook to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          LEGACY_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          LEGACY_KEY: ${{ secrets.KAGGLE_KEY }}
          EVENT: ${{ github.event_name }}
          ATTACH_INPUT: ${{ inputs.attach_dataset }}
        run: |
          set -e

          # ---------- 凭证准备（新式单 token 优先，旧式双 secret 兼容） ----------
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo "✓ 凭证：KAGGLE_API_TOKEN（新式单 token，用户名将自动识别）"
            unset LEGACY_USERNAME LEGACY_KEY
          elif [ -n "$LEGACY_USERNAME" ] && [ -n "$LEGACY_KEY" ]; then
            echo "✓ 凭证：KAGGLE_USERNAME + KAGGLE_KEY（旧式，转写为 kaggle.json）"
            mkdir -p ~/.kaggle
            printf '{"username":"%s","key":"%s"}' \
              "$LEGACY_USERNAME" "$LEGACY_KEY" \
              > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
            unset KAGGLE_API_TOKEN
          else
            echo "未配置 Kaggle 凭证，跳过同步。"
            echo ""
            echo "===== Fork 用户启用自动同步（一次性，2 分钟）====="
            echo "1. https://www.kaggle.com/settings → API → 生成 token"
            echo "2. 本仓库 Settings → Secrets and variables → Actions"
            echo "     → New repository secret"
            echo "     Name:  KAGGLE_API_TOKEN"
            echo "     Value: 粘贴 token"
            echo "3. Actions → Sync notebook to Kaggle → Run workflow"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::手动触发需要凭证：请按上方 3 步配置后重新 Run workflow"
              exit 1
            fi
            exit 0
          fi

          # ---------- 推送 ----------
          EXTRA=""
          if [ "$EVENT" = "workflow_dispatch" ] && \
             [ "$ATTACH_INPUT" = "false" ]; then
            EXTRA="--no-dataset"
          fi
          ./scripts/sync_kaggle.sh push $EXTRA
